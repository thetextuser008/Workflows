name: EUROPE DAILY (Austria, France, Netherlands, Sweden, Norway, Finland)

on:
  schedule:
    - cron: '*/40 * * * *'   # Runs every 40 minutes
  workflow_dispatch:          # One-click manual trigger (today's single date)

concurrency:
  group: europe-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        shard:
          - id: 1
            name: "Shard 1 (France & Austria)"
            scripts:
              - name: "France"
                primary: "france.py"
                fallback: "france/france.py"
              - name: "Austria"
                primary: "austria.py"
                fallback: "austria/austria.py"
          - id: 2
            name: "Shard 2 (Netherlands & Sweden)"
            scripts:
              - name: "Netherlands"
                primary: "netherlands.py"
                fallback: "netherlands/netherlands.py"
              - name: "Sweden"
                primary: "sweden.py"
                fallback: "sweden/sweden.py"
          - id: 3
            name: "Shard 3 (Norway & Finland)"
            scripts:
              - name: "Norway"
                primary: "normay.py"
                fallback: "norway.py"
                alt: "norway/norway.py"
              - name: "Finland"
                primary: "finland.py"
                fallback: "finland/finland.py"

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # 1. Clone Target Repository
      - name: Clone Private Target Repo
        run: |
          TARGET_REPO="thetextuser008/europe"
          if git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${TARGET_REPO}.git repo_dir; then
            echo "✅ Successfully cloned from ${TARGET_REPO}"
          else
            echo "❌ Failed to clone ${TARGET_REPO}"
            exit 1
          fi
          echo "TARGET_REPO=${TARGET_REPO}" >> $GITHUB_ENV

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi beautifulsoup4 tabulate python-dateutil pytz cloudscraper urllib3 Pillow numpy

      # 4. Auto-fetch Finnkino Live Token if needed (Shard 3)
      - name: Auto-fetch Finnkino Live Token (Shard 3)
        if: matrix.shard.id == 3
        env:
          WEBSHARE_PROXY: ${{ secrets.WEBSHARE_PROXY }}
        run: |
          cd repo_dir
          # Check if valid token already exists
          python3 -c '
          import os, json, sys, time, base64
          for p in ["cached_gas_token_fi.json", "finland/cached_gas_token_fi.json"]:
              if os.path.isfile(p):
                  try:
                      with open(p) as f:
                          d = json.load(f)
                      tok = d.get("gasToken") or d.get("token")
                      if tok:
                          payload = json.loads(base64.b64decode(tok.split(".")[1] + "=="))
                          if payload.get("exp", 0) > int(time.time()) + 600:
                              print("✅ Valid cached Finnkino token found.")
                              sys.exit(0)
                  except Exception:
                      pass
          print("⚠️ No valid cached token found. Fetching fresh token...")
          sys.exit(1)
          ' && exit 0 || true

          echo "🚀 Setting up Turnstile solver for Finland..."
          sudo apt-get update -y && sudo apt-get install -y xvfb libgbm-dev 2>/dev/null || true
          npm install puppeteer-real-browser 2>/dev/null || true

          if [ -f "get_finnkino_token.js" ]; then
            xvfb-run --auto-servernum node get_finnkino_token.js || true
          elif [ -f "mcp-chrome-cloudflare-bypass/finnkino_fetcher.js" ]; then
            xvfb-run --auto-servernum node mcp-chrome-cloudflare-bypass/finnkino_fetcher.js || true
          elif [ -f "finland/get_finnkino_token.js" ]; then
            xvfb-run --auto-servernum node finland/get_finnkino_token.js || true
          fi

      # 5. Run Daily Trackers for this Shard
      - name: Run Shard Trackers (Daily Mode - Single Date)
        run: |
          cd repo_dir

          # Single target date: Today (Day 0)
          export TARGET_DATE=$(date +"%Y%m%d")
          echo "📅 Processing Single Date [DAILY]: ${TARGET_DATE}"

          # Parse matrix scripts JSON and run sequentially within this shard
          SCRIPTS_JSON='${{ toJson(matrix.shard.scripts) }}'

          echo "$SCRIPTS_JSON" | python3 -c '
          import sys, json, os, subprocess, time
          from datetime import datetime

          scripts = json.loads(sys.stdin.read())
          target_date = os.environ.get("TARGET_DATE", "").strip()
          if not target_date:
              target_date = datetime.now().strftime("%Y%m%d")

          for sc in scripts:
              name = sc.get("name", "Unknown")
              script_file = None
              for key in ["primary", "fallback", "alt"]:
                  cand = sc.get(key)
                  if cand and os.path.isfile(cand):
                      script_file = cand
                      break

              if not script_file:
                  # Try finding by name in root or subdirectories
                  cand_base = f"{name.lower()}.py"
                  if os.path.isfile(cand_base):
                      script_file = cand_base
                  else:
                      print(f"⚠️ Script for {name} not found, skipping...")
                      continue

              print("\n" + "=" * 80)
              print(f"🚀 Running {name} ({script_file}) [Mode: DAILY | Date: {target_date}]")
              print("=" * 80)

              cmd = [sys.executable, script_file, "--mode", "daily", "--date", target_date]
              
              success = False
              for attempt in range(1, 4):
                  print(f"▶️ Attempt {attempt}/3...")
                  res = subprocess.run(cmd)
                  if res.returncode == 0:
                      print(f"✅ {name} completed successfully.")
                      success = True
                      break
                  else:
                      print(f"❌ Attempt {attempt} failed with exit code {res.returncode}. Retrying in 8s...")
                      time.sleep(8)

              if not success:
                  print(f"⚠️ Warning: {name} failed after 3 attempts.")
          '

      # 5. Commit & Push Data back to thetextuser008/europe
      - name: Commit & Push Scraper Data
        run: |
          cd repo_dir
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove python cache
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          git rm -rf --cached __pycache__ 2>/dev/null || true

          git add cached_gas_token_fi.json finland/cached_gas_token_fi.json data/ || git add . || true
          git commit -m "daily update [${{ matrix.shard.name }}] ($(date -u +'%Y-%m-%d %H:%M UTC'))" || echo "No changes to commit"

          # Jitter sleep to avoid simultaneous push contention between shards
          sleep $(( RANDOM % 10 + 2 ))

          for i in {1..8}; do
            echo "Push attempt $i..."
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main || true
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            git rm -rf --cached __pycache__ 2>/dev/null || true

            if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${TARGET_REPO}.git main; then
              echo "✅ Push succeeded to ${TARGET_REPO}"
              break
            fi
            echo "❌ Push failed. Retrying in 5 seconds..."
            sleep 5
          done

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    needs: scrape-daily
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Clone Latest Target Repo
        run: |
          TARGET_REPO="thetextuser008/europe"
          if git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${TARGET_REPO}.git repo_dir; then
            echo "✅ Successfully cloned ${TARGET_REPO}"
          else
            echo "❌ Failed to clone ${TARGET_REPO}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare Deployment Directory
        run: |
          mkdir -p deploy_dir
          if [ -d "repo_dir/data" ]; then
            cp -r repo_dir/data/* deploy_dir/ 2>/dev/null || true
            mkdir -p deploy_dir/data
            cp -r repo_dir/data/* deploy_dir/data/ 2>/dev/null || true
          fi
          echo "📁 Total files ready for deployment: $(find deploy_dir -type f | wc -l)"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFALRE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ID }}
          CLOUDFLARE_PAGES_NAME: ${{ secrets.CLOUDFLARE_PAGES_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_PAGES_NAME" ]; then
            echo "⚠️ CLOUDFLARE_API_TOKEN or CLOUDFLARE_PAGES_NAME not found in secrets. Skipping deployment."
            exit 0
          fi

          echo "🚀 Deploying to Cloudflare Pages project: ${CLOUDFLARE_PAGES_NAME}"
          npx wrangler pages project create "${CLOUDFLARE_PAGES_NAME}" --production-branch=main 2>/dev/null || true
          npx wrangler pages deploy deploy_dir --project-name="${CLOUDFLARE_PAGES_NAME}" --branch=main --commit-dirty=true
